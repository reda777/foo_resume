name: Build and Package foo_resume

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout foo_resume
      uses: actions/checkout@v4
      with:
        path: foo_resume

    - name: Checkout SDK
      uses: actions/checkout@v4
      with:
        repository: reda777/fb2k-sdk
        path: sdk
        token: ${{ secrets.SDK_TOKEN }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Install ATL
      shell: cmd
      run: |
        "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
          --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" ^
          --add Microsoft.VisualStudio.Component.VC.ATL ^
          --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 ^
          --quiet --norestart --force

    - name: Create Out Directory
      run: mkdir out
    # ------------------------

    - name: Build x86
      working-directory: foo_resume
      run: msbuild foo_resume.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143

    - name: Build x64
      working-directory: foo_resume
      run: msbuild foo_resume.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/foo_resume.fb2k-component
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        draft: false

        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

        make_latest: ${{ !(contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: foo_resume-package
        path: out/foo_resume.fb2k-component