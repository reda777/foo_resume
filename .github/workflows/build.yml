name: Build and Package foo_resume

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout foo_resume
      uses: actions/checkout@v4
      with:
        path: foo_resume

    - name: Checkout SDK
      uses: actions/checkout@v4
      with:
        repository: reda777/fb2k-sdk
        path: sdk
        token: ${{ secrets.SDK_TOKEN }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Install ATL
      shell: pwsh
      run: |
        $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vsWhere -latest -property installationPath
        Write-Host "VS install path: $vsPath"
        
        $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        $process = Start-Process -FilePath $installer -ArgumentList "modify","--installPath","$vsPath","--add","Microsoft.VisualStudio.Component.VC.ATL","--quiet","--norestart","--force" -Wait -PassThru
        Write-Host "Exit code: $($process.ExitCode)"
        
        $atlPath = "$vsPath\VC\Tools\MSVC"
        $found = Get-ChildItem -Path $atlPath -Recurse -Filter "atlbase.h" -ErrorAction SilentlyContinue
        if ($found) { Write-Host "ATL found: $($found.FullName)" }
        else { Write-Host "ATL NOT found after install" }

    - name: Create Out Directory
      run: mkdir out
    # ------------------------

    - name: Build x86
      working-directory: foo_resume
      run: msbuild foo_resume.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143

    - name: Build x64
      working-directory: foo_resume
      run: msbuild foo_resume.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/foo_resume.fb2k-component
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        draft: false

        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

        make_latest: ${{ !(contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: foo_resume-package
        path: out/foo_resume.fb2k-component